# yaml-language-server: $schema=https://raw.githubusercontent.com/KernelSU-Modules/tools/main/schemas/module.schema.json
# Maintained HERE (the source repo). The release workflow copies it, DESCRIPTION.md and the icon to the
# public release repository KernelSU-Modules/example-closed-module-dist on every release.
schemaVersion: 1
id: example_closed_module_demo
name: Example Closed Module Demo
summary: Shows how a closed-source module publishes releases to a separate public repository
description: DESCRIPTION.md
license: MIT
homepage: https://github.com/KernelSU-Modules/example-closed-module-dist
support: https://github.com/KernelSU-Modules/example-closed-module-dist/issues
tags: [example, tools]
icon: assets/icon.png
metamodule: false

authors:
  - name: KernelSU-Modules contributors
    url: https://github.com/KernelSU-Modules

compatibility:
  androidMinApi: 29
  architectures: [arm64-v8a, x86_64]

release:
  assetPattern: "example_closed_module_demo-*.zip"
